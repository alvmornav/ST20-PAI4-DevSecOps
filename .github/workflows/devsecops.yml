name: DevSecOps Pipeline - ST20

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: juice-shop-st20
  DEFECTDOJO_PRODUCT_ID: 1

jobs:
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Juice Shop Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Save Docker image artifact
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o juice-shop-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: juice-shop-image.tar
          retention-days: 1

  security-scans:
    name: Security Scans & DefectDojo Ingestion
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i juice-shop-image.tar

      - name: Run Trivy Container Scan (JSON)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy Report to DefectDojo
        run: |
          curl -s -S -f -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Trivy Scan" \
            -F "product=${{ env.DEFECTDOJO_PRODUCT_ID }}" \
            -F "engagement_name=CI-CD Pipeline ST20" \
            -F "auto_create_context=true" \
            -F "deduplication_on_engagement=true" \
            -F "file=@trivy-results.json"

      - name: Upload Scan Reports as GitHub Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: trivy-results.json