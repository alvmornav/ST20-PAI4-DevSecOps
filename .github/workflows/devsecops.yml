name: DevSecOps Pipeline - ST20

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: juice-shop-st20
  DEFECTDOJO_PRODUCT_NAME: "Juice Shop ST20"

jobs:
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Juice Shop Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Save Docker image artifact
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o juice-shop-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: juice-shop-image.tar
          retention-days: 1

  security-scans:
    name: Security Scans, DefectDojo Ingestion & Quality Gate
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i juice-shop-image.tar

      # ==========================================================
      # ROL A (PLATAFORMA): Escaneo de contenedor (Trivy)
      # ==========================================================
      - name: Run Trivy Container Scan (JSON)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/workspace" \
            aquasec/trivy:latest image \
            --format json \
            --output /workspace/trivy-results.json \
            --severity CRITICAL,HIGH,MEDIUM \
            "${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Upload Trivy Report to DefectDojo
        run: |
          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Trivy Scan" \
            -F "product_name=${{ env.DEFECTDOJO_PRODUCT_NAME }}" \
            -F "engagement_name=CI-CD Pipeline ST20" \
            -F "auto_create_context=true" \
            -F "deduplication_on_engagement=true" \
            -F "file=@trivy-results.json")
          echo "HTTP Status: $HTTP_CODE"
          cat response.txt
          if [ "$HTTP_CODE" -ne 201 ] && [ "$HTTP_CODE" -ne 200 ]; then
            exit 1
          fi

      # ==========================================================
      # ROL B (ANÁLISIS EN BUILD: SAST, SCA, IaC)
      # ==========================================================

      # --- 1. SAST & Secrets con Semgrep ---
      - name: Run Semgrep SAST & Secrets Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            semgrep/semgrep semgrep scan \
            --config p/owasp-top-ten \
            --config p/nodejsscan \
            --config p/secrets \
            --json \
            --output /src/semgrep.json \
            /src

      - name: Upload Semgrep Report to DefectDojo
        run: |
          HTTP_CODE=$(curl -s -o response_semgrep.txt -w "%{http_code}" -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Semgrep JSON Report" \
            -F "product_name=${{ env.DEFECTDOJO_PRODUCT_NAME }}" \
            -F "engagement_name=CI-CD Pipeline ST20" \
            -F "auto_create_context=true" \
            -F "deduplication_on_engagement=true" \
            -F "file=@semgrep.json")
          echo "Semgrep Upload HTTP Status: $HTTP_CODE"
          cat response_semgrep.txt
          if [ "$HTTP_CODE" -ne 201 ] && [ "$HTTP_CODE" -ne 200 ]; then
            exit 1
          fi

      # --- 2. SCA con OWASP Dependency-Check ---
      - name: Set up Node.js for Dependency-Check lockfile
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Ensure package-lock.json exists
        run: if [ ! -f "package-lock.json" ]; then npm install --package-lock-only --ignore-scripts; fi

      - name: Install dependencies safely (ignoring scripts & strict build)
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Run OWASP Dependency-Check SCA
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'juice-shop'
          path: '.'
          format: 'JSON'
          out: 'reports'
          args: >
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --exclude "**/node_modules/**"
            --exclude "**/test/**"
            --exclude "**/build/**"

      - name: Upload Dependency-Check Report to DefectDojo
        run: |
          HTTP_CODE=$(curl -s -o response_dc.txt -w "%{http_code}" -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=OWASP Dependency Check Scan" \
            -F "product_name=${{ env.DEFECTDOJO_PRODUCT_NAME }}" \
            -F "engagement_name=CI-CD Pipeline ST20" \
            -F "auto_create_context=true" \
            -F "deduplication_on_engagement=true" \
            -F "file=@reports/dependency-check-report.json")
          echo "Dependency-Check Upload HTTP Status: $HTTP_CODE"
          cat response_dc.txt
          if [ "$HTTP_CODE" -ne 201 ] && [ "$HTTP_CODE" -ne 200 ]; then
            exit 1
          fi

      # --- 3. IaC con Checkov ---
      - name: Run Checkov IaC Scan
        uses: bridgecrewio/checkov-action@master
        with:
          framework: dockerfile,kubernetes
          output_format: json
          output_file_path: checkov-results.json
        continue-on-error: true

      - name: Upload Checkov Report to DefectDojo
        run: |
          HTTP_CODE=$(curl -s -o response_checkov.txt -w "%{http_code}" -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Checkov Scan" \
            -F "product_name=${{ env.DEFECTDOJO_PRODUCT_NAME }}" \
            -F "engagement_name=CI-CD Pipeline ST20" \
            -F "auto_create_context=true" \
            -F "deduplication_on_engagement=true" \
            -F "file=@checkov-results.json")
          echo "Checkov Upload HTTP Status: $HTTP_CODE"
          cat response_checkov.txt
          if [ "$HTTP_CODE" -ne 201 ] && [ "$HTTP_CODE" -ne 200 ]; then
            exit 1
          fi

      # ==========================================================
      # GUARDAR REPORTES COMO ARTEFACTOS
      # ==========================================================
      - name: Upload Scan Reports as GitHub Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy-results.json
            semgrep.json
            reports/dependency-check-report.json
            checkov-results.json

      # ==========================================================
      # QUALITY GATE CENTRALIZADO EN DEFECTDOJO
      # ==========================================================
      - name: Quality Gate - Evaluate Critical Findings in DefectDojo
        run: |
          RESPONSE=$(curl -s -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/findings/?product_name=Juice%20Shop%20ST20&severity=Critical&active=true&duplicate=false")
          CRITICAL_COUNT=$(echo "$RESPONSE" | jq '.count')
          echo "Vulnerabilidades Críticas activas en DefectDojo: $CRITICAL_COUNT"
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ Quality Gate fallido: existen $CRITICAL_COUNT vulnerabilidades críticas sin mitigar en DefectDojo."
            exit 1
          fi
          echo "✅ Quality Gate superado: 0 vulnerabilidades críticas activas."