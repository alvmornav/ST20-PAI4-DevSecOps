name: DevSecOps Pipeline ST20

on:
  push:
    branches: [main, rol-b]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: juice-shop-st20
  DD_PRODUCT: Juice Shop ST20
  DD_ENGAGEMENT: CI/CD GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker save ${{ env.IMAGE }}:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure package-lock.json
        run: test -f package-lock.json || npm install --package-lock-only --ignore-scripts

      - uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: dc-data-${{ github.run_id }}
          restore-keys: dc-data-

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: juice-shop
          path: '.'
          format: 'XML'
          out: 'reports'
          args: >
            --format HTML
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --suppression security/dependency-check-suppressions.xml
            --exclude "**/node_modules/**"
            --exclude "**/test/**"

      - name: Upload SCA to DefectDojo
        if: always()
        run: bash scripts/dd-upload.sh "Dependency Check Scan" reports/dependency-check-report.xml "SCA - Dependency-Check"
        env:
          DD_URL: ${{ secrets.DD_URL }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}

      - name: Upload SCA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-sca
          path: reports/

      - name: Quality gate G1
        continue-on-error: true
        run: |
          if [ -f "scripts/quality_gate.py" ]; then
            python3 scripts/quality_gate.py --tool dependency-check --report reports/dependency-check-report.xml --threshold 7.0 --mode warn
          else
            echo "::warning title=Quality Gate G1::Pendiente scripts/quality_gate.py (Rol C)"
          fi

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.95.0 semgrep scan \
            --config p/owasp-top-ten --config p/nodejsscan --config p/secrets \
            --json --output semgrep.json || true

      - name: Upload SAST to DefectDojo
        if: always()
        run: bash scripts/dd-upload.sh "Semgrep JSON Report" semgrep.json "SAST - Semgrep"
        env:
          DD_URL: ${{ secrets.DD_URL }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}

      - name: Upload SAST Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-sast
          path: semgrep.json

      - name: Quality gate G2
        continue-on-error: true
        run: |
          if [ -f "scripts/quality_gate.py" ]; then
            python3 scripts/quality_gate.py --tool semgrep --report semgrep.json --threshold ERROR --mode warn
          else
            echo "::warning title=Quality Gate G2::Pendiente scripts/quality_gate.py (Rol C)"
          fi

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov Dockerfile
        run: |
          docker run --rm -v "$PWD:/code" bridgecrew/checkov:3.2.280 -d /code \
            --framework dockerfile --config-file /code/security/.checkov.yaml \
            -o json --soft-fail > checkov-docker.json || true

      - name: Checkov Kubernetes
        run: |
          if [ -d "k8s" ]; then
            docker run --rm -v "$PWD:/code" bridgecrew/checkov:3.2.280 -d /code/k8s \
              --framework kubernetes --config-file /code/security/.checkov.yaml \
              -o json --soft-fail > checkov-k8s.json || true
          fi

      - name: Upload IaC Docker to DefectDojo
        if: always()
        run: bash scripts/dd-upload.sh "Checkov Scan" checkov-docker.json "IaC - Checkov"
        env:
          DD_URL: ${{ secrets.DD_URL }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}

      - name: Upload IaC K8s to DefectDojo
        if: always() && hashFiles('checkov-k8s.json') != ''
        run: bash scripts/dd-upload.sh "Checkov Scan" checkov-k8s.json "IaC - Checkov K8s"
        env:
          DD_URL: ${{ secrets.DD_URL }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}

      - name: Upload IaC Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-iac
          path: checkov-*.json

      - name: Quality gate G3
        continue-on-error: true
        run: |
          if [ -f "scripts/quality_gate.py" ]; then
            python3 scripts/quality_gate.py --tool checkov --report checkov-docker.json --threshold 1 --mode warn
            if [ -f "checkov-k8s.json" ]; then
              python3 scripts/quality_gate.py --tool checkov --report checkov-k8s.json --threshold 1 --mode warn
            fi
          else
            echo "::warning title=Quality Gate G3::Pendiente scripts/quality_gate.py (Rol C)"
          fi

  container:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Run Trivy Container Scan
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            aquasec/trivy:latest image \
            --input image.tar \
            --format json \
            --output trivy.json \
            --ignorefile security/.trivyignore \
            --exit-code 0

      - name: Upload Container Scan to DefectDojo
        if: always()
        run: bash scripts/dd-upload.sh "Trivy Scan" trivy.json "Container - Trivy"
        env:
          DD_URL: ${{ secrets.DD_URL }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}

      - name: Upload Container Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-container
          path: trivy.json

      - name: Quality gate G4
        continue-on-error: true
        run: |
          if [ -f "scripts/quality_gate.py" ]; then
            python3 scripts/quality_gate.py --tool trivy --report trivy.json --threshold CRITICAL --mode warn
          else
            echo "::warning title=Quality Gate G4::Pendiente scripts/quality_gate.py (Rol C)"
          fi

  dast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Rol C: OWASP ZAP + G5"'

  security-gate:
    needs: [sca, sast, iac, container, dast]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Rol C: Gate G6 + DefectDojo"'

  deploy:
    needs: [dast, security-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/juice-shop-st20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: docker load -i image.tar
      - name: Push a GHCR
        run: |
          IMG=$(echo "$REGISTRY_IMAGE" | tr '[:upper:]' '[:lower:]'):${{ github.sha }}
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag ${{ env.IMAGE }}:${{ github.sha }} "$IMG"
          docker push "$IMG"
      - uses: helm/kind-action@v1
        with:
          cluster_name: st20
      - run: kind load docker-image "$IMG" --name st20
      - run: |
          kubectl apply -f k8s/
          kubectl -n juice-shop set image deployment/juice-shop juice-shop="$IMG"
          kubectl -n juice-shop rollout status deployment/juice-shop --timeout=180s
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            kubectl -n juice-shop port-forward svc/juice-shop 3000:3000 >/dev/null 2>&1 &
            PF_PID=$!
            sleep 3
            if curl -sf http://localhost:3000 > /dev/null; then
              kill $PF_PID 2>/dev/null || true
              exit 0
            fi
            kill $PF_PID 2>/dev/null || true
          done
          exit 1

  notify:
    needs: [dast, security-gate, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Rol C: Notificación"'