name: DevSecOps Pipeline ST20

on:
  push:
    branches: [main, demo/gate]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: juice-shop-st20
  DD_PRODUCT: Juice Shop ST20
  DD_ENGAGEMENT: CI/CD GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker save ${{ env.IMAGE }}:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 3

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure package-lock.json
        run: test -f package-lock.json || npm install --package-lock-only --ignore-scripts

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: juice-shop
          path: '.'
          format: 'XML'
          out: 'reports'
          args: >
            --format HTML
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --suppression security/dependency-check-suppressions.xml
            --exclude "**/node_modules/**"
            --exclude "**/test/**"

      - name: Upload SCA to DefectDojo
        if: always()
        run: bash scripts/dd-upload.sh "Dependency Check Scan" reports/dependency-check-report.xml "SCA - Dependency-Check"
        env:
          DD_URL: ${{ secrets.DD_URL }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}

      - name: Upload SCA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-sca
          path: reports/

      - name: Quality gate G1
        if: always()
        continue-on-error: true
        run: python3 scripts/quality_gate.py --tool dependency-check --report reports/dependency-check-report.xml --threshold 7.0 --mode warn

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.95.0 semgrep scan \
            --config p/owasp-top-ten --config p/nodejsscan --config p/secrets \
            --json --output semgrep.json || true

      - name: Upload SAST to DefectDojo
        if: always()
        run: bash scripts/dd-upload.sh "Semgrep JSON Report" semgrep.json "SAST - Semgrep"
        env:
          DD_URL: ${{ secrets.DD_URL }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}

      - name: Upload SAST Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-sast
          path: semgrep.json

      - name: Quality gate G2
        if: always()
        continue-on-error: true
        run: python3 scripts/quality_gate.py --tool semgrep --report semgrep.json --threshold ERROR --mode warn

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov Dockerfile
        run: |
          docker run --rm -v "$PWD:/code" bridgecrew/checkov:3.2.280 -d /code \
            --framework dockerfile --config-file /code/security/.checkov.yaml \
            -o json --soft-fail > checkov-docker.json || true

      - name: Checkov Kubernetes
        run: |
          docker run --rm -v "$PWD:/code" bridgecrew/checkov:3.2.280 -d /code/k8s \
            --framework kubernetes --config-file /code/security/.checkov.yaml \
            -o json --soft-fail > checkov-k8s.json || true

      - name: Upload IaC Docker to DefectDojo
        if: always()
        run: bash scripts/dd-upload.sh "Checkov Scan" checkov-docker.json "IaC - Checkov"
        env:
          DD_URL: ${{ secrets.DD_URL }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}

      - name: Upload IaC K8s to DefectDojo
        if: always()
        run: bash scripts/dd-upload.sh "Checkov Scan" checkov-k8s.json "IaC - Checkov K8s"
        env:
          DD_URL: ${{ secrets.DD_URL }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}

      - name: Upload IaC Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-iac
          path: checkov-*.json

      - name: Quality gate G3
        if: always()
        continue-on-error: true
        run: |
          rc=0
          python3 scripts/quality_gate.py --tool checkov --report checkov-docker.json --threshold 1 --mode warn || rc=1
          python3 scripts/quality_gate.py --tool checkov --report checkov-k8s.json --threshold 1 --mode warn || rc=1
          exit $rc

  container:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Run Trivy Container Scan
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            aquasec/trivy:0.58.1 image \
            --input image.tar \
            --format json \
            --output trivy.json \
            --ignorefile security/.trivyignore \
            --exit-code 0

      - name: Upload Container Scan to DefectDojo
        if: always()
        run: bash scripts/dd-upload.sh "Trivy Scan" trivy.json "Container - Trivy"
        env:
          DD_URL: ${{ secrets.DD_URL }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}

      - name: Upload Container Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-container
          path: trivy.json

      - name: Quality gate G4
        if: always()
        continue-on-error: true
        run: python3 scripts/quality_gate.py --tool trivy --report trivy.json --threshold CRITICAL --mode warn

  dast:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Start Juice Shop
        run: |
          docker load -i image.tar
          docker run -d --name app -p 3000:3000 ${{ env.IMAGE }}:${{ github.sha }}
          timeout 180 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 5; done'

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: http://localhost:3000
          rules_file_name: security/zap/rules.tsv
          cmd_options: -a -j -m 5 -x report_xml.xml
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-raw

      - name: Upload DAST to DefectDojo
        if: always()
        run: bash scripts/dd-upload.sh "ZAP Scan" report_xml.xml "DAST - ZAP"
        env:
          DD_URL: ${{ secrets.DD_URL }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}

      - name: Upload DAST Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-dast
          path: |
            report_json.json
            report_xml.xml
            report_html.html

      - name: Quality gate G5
        if: always()
        run: python3 scripts/quality_gate.py --tool zap --report report_json.json --threshold High --ignore security/zap/rules.tsv --mode block

  security-gate:
    needs: [sca, sast, iac, container, dast]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports

      - name: Quality gate G6 - SCA (CVSS >= 9.0)
        id: g6_sca
        continue-on-error: true
        run: python3 scripts/quality_gate.py --tool dependency-check --report reports/report-sca/dependency-check-report.xml --threshold 9.0 --mode block

      - name: Quality gate G6 - Container (CRITICAL)
        id: g6_container
        continue-on-error: true
        run: python3 scripts/quality_gate.py --tool trivy --report reports/report-container/trivy.json --threshold CRITICAL --mode block

      - name: Estado en DefectDojo
        continue-on-error: true
        run: bash scripts/dd-gate-summary.sh
        env:
          DD_URL: ${{ secrets.DD_URL }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}

      - name: Decision G6
        run: |
          if [ "${{ steps.g6_sca.outcome }}" != "success" ] || [ "${{ steps.g6_container.outcome }}" != "success" ]; then
            echo "::error title=Quality gate G6::Release bloqueada: SCA=${{ steps.g6_sca.outcome }}, Container=${{ steps.g6_container.outcome }}"
            exit 1
          fi
          echo "Quality gate G6 superado"

  deploy:
    needs: [dast, security-gate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/juice-shop-st20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: docker load -i image.tar
      - name: Push a GHCR
        run: |
          IMG=$(echo "$REGISTRY_IMAGE" | tr '[:upper:]' '[:lower:]'):${{ github.sha }}
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag ${{ env.IMAGE }}:${{ github.sha }} "$IMG"
          docker push "$IMG"
      - uses: helm/kind-action@v1
        with:
          cluster_name: st20
      - run: kind load docker-image "$IMG" --name st20
      - run: |
          kubectl apply -f k8s/
          kubectl -n juice-shop set image deployment/juice-shop juice-shop="$IMG"
          kubectl -n juice-shop rollout status deployment/juice-shop --timeout=180s
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            kubectl -n juice-shop port-forward svc/juice-shop 3000:3000 >/dev/null 2>&1 &
            PF_PID=$!
            sleep 3
            if curl -sf http://localhost:3000 > /dev/null; then
              kill $PF_PID 2>/dev/null || true
              exit 0
            fi
            kill $PF_PID 2>/dev/null || true
          done
          exit 1
      - name: Estado del despliegue
        if: always()
        run: |
          kubectl -n juice-shop get deploy,pods,svc -o wide
          echo "### Despliegue en kind" >> "$GITHUB_STEP_SUMMARY"
          echo "Imagen desplegada: \`$IMG\`" >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: [dast, security-gate, deploy]
    if: failure()
    runs-on: ubuntu-latest
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Aviso por Discord
        if: env.DISCORD_WEBHOOK != ''
        run: |
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\":\"Pipeline ST20 bloqueado por un quality gate en ${GITHUB_REF_NAME} (${GITHUB_SHA::7}): $RUN_URL\"}" \
            "$DISCORD_WEBHOOK"
      - run: echo "::error title=Pipeline bloqueado::$RUN_URL"
