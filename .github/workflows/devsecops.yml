name: DevSecOps Pipeline ST20

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: juice-shop-st20
  DD_PRODUCT: Juice Shop ST20
  DD_ENGAGEMENT: CI/CD GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker save ${{ env.IMAGE }}:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  sca:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Rol B: Dependency-Check + G1"'

  sast:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Rol B: Semgrep + G2"'

  iac:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Rol B: Checkov + G3"'

  container:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Rol B: Trivy + G4"'

  dast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Rol C: OWASP ZAP + G5"'

  security-gate:
    needs: [sca, sast, iac, container, dast]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Rol C: Gate G6 + DefectDojo"'

  deploy:
    needs: [dast, security-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/juice-shop-st20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: docker load -i image.tar
      - name: Push a GHCR
        run: |
          IMG=$(echo "$REGISTRY_IMAGE" | tr '[:upper:]' '[:lower:]'):${{ github.sha }}
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag ${{ env.IMAGE }}:${{ github.sha }} "$IMG"
          docker push "$IMG"
      - uses: helm/kind-action@v1
        with:
          cluster_name: st20
      - run: kind load docker-image "$IMG" --name st20
      - run: |
          kubectl apply -f k8s/
          kubectl -n juice-shop set image deployment/juice-shop juice-shop="$IMG"
          kubectl -n juice-shop rollout status deployment/juice-shop --timeout=180s
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            kubectl -n juice-shop port-forward svc/juice-shop 3000:3000 >/dev/null 2>&1 &
            PF_PID=$!
            sleep 3
            if curl -sf http://localhost:3000 > /dev/null; then
              kill $PF_PID 2>/dev/null || true
              exit 0
            fi
            kill $PF_PID 2>/dev/null || true
          done
          exit 1

  notify:
    needs: [dast, security-gate, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Rol C: Notificación"'
