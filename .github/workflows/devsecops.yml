name: DevSecOps Pipeline - ST20

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: juice-shop-st20
  DEFECTDOJO_PRODUCT_NAME: "Juice Shop ST20"

jobs:
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Juice Shop Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Save Docker image artifact
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o juice-shop-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: juice-shop-image.tar
          retention-days: 1

  security-scans:
    name: Security Scans, DefectDojo Ingestion & Quality Gate
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i juice-shop-image.tar

      # ==========================================================
      # ROL A (PLATAFORMA): Escaneo de contenedor (Trivy)
      # ==========================================================
      - name: Run Trivy Container Scan (JSON)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/workspace" \
            aquasec/trivy:latest image \
            --format json \
            --output /workspace/trivy-results.json \
            --severity CRITICAL,HIGH,MEDIUM \
            "${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Upload Trivy Report to DefectDojo
        run: |
          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Trivy Scan" \
            -F "product_name=${{ env.DEFECTDOJO_PRODUCT_NAME }}" \
            -F "engagement_name=CI-CD Pipeline ST20" \
            -F "auto_create_context=true" \
            -F "deduplication_on_engagement=true" \
            -F "file=@trivy-results.json")
          echo "HTTP Status: $HTTP_CODE"
          cat response.txt
          if [ "$HTTP_CODE" -ne 201 ] && [ "$HTTP_CODE" -ne 200 ]; then
            exit 1
          fi

      # ==========================================================
      # ESPACIO PARA ROL B (SAST / SCA / SECRETOS)
      # Añadir aquí Semgrep, Gitleaks y Trivy FS/SBOM + curl a DefectDojo
      # ==========================================================

      # ==========================================================
      # ESPACIO PARA ROL C (DAST - OWASP ZAP)
      # Levantar contenedor en puerto 3000, ejecutar ZAP + curl a DefectDojo
      # ==========================================================

      - name: Upload Scan Reports as GitHub Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: trivy-results.json

      # ==========================================================
      # ROL A (PLATAFORMA): Quality Gate centralizado en DefectDojo
      # ==========================================================
      - name: Quality Gate - Evaluate Critical Findings in DefectDojo
        run: |
          RESPONSE=$(curl -s -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/findings/?product_name=Juice%20Shop%20ST20&severity=Critical&active=true&duplicate=false")
          CRITICAL_COUNT=$(echo "$RESPONSE" | jq '.count')
          echo "Vulnerabilidades Críticas activas en DefectDojo: $CRITICAL_COUNT"
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ Quality Gate fallido: existen $CRITICAL_COUNT vulnerabilidades críticas sin mitigar en DefectDojo."
            exit 1
          fi
          echo "✅ Quality Gate superado: 0 vulnerabilidades críticas activas."